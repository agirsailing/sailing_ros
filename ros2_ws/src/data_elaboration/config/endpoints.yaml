# Input topic names are imported from sensors.generated.ros_endpoints.
# This registry owns only processing outputs.
meta:
  generate:
    cpp: false
    python: true

topics:
  # Intermediate transformer outputs; final public IMU topics remain unchanged.
  imu_mounted: /internal/imu/mounted
  imu_aero_body: /internal/imu/aero_body
  # Private unused magnetometer ports of each imu_transformer instance.
  transformer_mag_in: ~/mag_in
  transformer_mag_out: ~/mag_out
  boat_height: /processed/boat_height
  imu_data: /processed/imu/data
  imu_rpy: /processed/imu/rpy
  imu_data_aero: /processed/imu/data/aero
  imu_rpy_aero: /processed/imu/rpy/aero
  heading_deg: /processed/heading_deg
  gps_summary: /processed/gps/summary
  battery_low: /processed/battery/low

nodes:
  ultrasonic_filter_node:
    pub:
      height: "@boat_height"
  imu_node:
    sub:
      imu: "@imu_mounted"
      imu_aero: "@imu_aero_body"
    pub:
      imu: "@imu_data"
      rpy: "@imu_rpy"
      imu_aero: "@imu_data_aero"
      rpy_aero: "@imu_rpy_aero"
  imu_mount_transformer_node:
    pub:
      imu_out: "@imu_mounted"
  imu_aero_transformer_node:
    sub:
      imu_in: "@imu_data"
    pub:
      imu_out: "@imu_aero_body"
  heading_node:
    pub:
      heading_deg: "@heading_deg"
      gps_summary: "@gps_summary"
  battery_monitor_node:
    pub:
      battery_low: "@battery_low"
