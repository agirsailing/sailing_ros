# Acquisition configuration for nodes in the sensors package.
# Topic names live exclusively in each package's endpoints.yaml.
ultrasonic_left_node:
  ros__parameters:
    enabled: true
    # Stable udev alias: physical USB port 1.4 on the Raspberry Pi 4.
    endpoint_group: ULTRASONIC_LEFT_NODE
    port: /dev/ultrasonic_left
    baudrate: 9600
    timeout_s: 0.1
    # 0.0: wait for incoming serial data; positive: poll at this rate in Hz.
    # This does not change the sensor's physical measurement frequency.
    read_rate_hz: 0.0
    # Publish the latest sample every 50 ms, keeping its original timestamp.
    publish_rate_hz: 20.0
    # Stop publishing if no valid new sample arrives within this interval.
    max_sample_age_s: 0.5
    frame_id: ultrasonic_left
    min_range_m: 0.03
    max_range_m: 4.5
    field_of_view_rad: 0.1
    qos_depth: 10

ultrasonic_right_node:
  ros__parameters:
    # Both bow sensors are enabled for attitude-dependent fusion.
    enabled: true
    # Stable udev alias: physical USB port 1.3 on the Raspberry Pi 4.
    endpoint_group: ULTRASONIC_RIGHT_NODE
    port: /dev/ultrasonic_right
    baudrate: 9600
    timeout_s: 0.1
    # 0.0: wait for incoming serial data; positive: poll at this rate in Hz.
    # This does not change the sensor's physical measurement frequency.
    read_rate_hz: 0.0
    # Publish the latest sample every 50 ms, keeping its original timestamp.
    publish_rate_hz: 20.0
    # Stop publishing if no valid new sample arrives within this interval.
    max_sample_age_s: 0.5
    frame_id: ultrasonic_right
    min_range_m: 0.03
    max_range_m: 4.5
    field_of_view_rad: 0.1
    qos_depth: 10

gps_node:
  ros__parameters:
    # Stable udev alias: physical USB port 1.2 on the Raspberry Pi 4.
    port: /dev/gps
    baudrate: 230400
    timeout_s: 0.1
    # 0.0: decode serial packets as they arrive; positive: drain on each poll.
    # This does not configure the receiver's NAV-PVT measurement/output rate.
    read_rate_hz: 0.0
    # Repeat the newest NAV-PVT at 10 Hz, preserving its timestamp and GPSStatus.
    publish_rate_hz: 10.0
    # Missing NAV-PVT expires; a new STATUS_NO_FIX packet is still published.
    max_sample_age_s: 1.0
    frame_id: gps
    qos_depth: 10

imu_sensor_node:
  ros__parameters:
    port: /dev/ttyAMA0
    baudrate: 3000000
    frame_id: imu
    # 0.0 waits for UART data; positive values poll buffered data.
    read_rate_hz: 0.0
    # ROS publication target, matching data_elaboration/imu_node at 50 Hz.
    publish_rate_hz: 50.0
    max_sample_age_s: 0.5
    timeout_s: 0.1
    # Ask the BNO085 firmware to produce orientation/acceleration/gyro reports
    # at this rate (Hz). This is separate from reading UART and publishing ROS.
    report_rate_hz: 100.0
    # The internal magnetometer has its own requested device report rate.
    magnetometer_rate_hz: 50.0
    orientation_report: rotation_vector
    roll_pitch_variance_rad2: 0.0
    reset_delay_s: 0.5
    stale_timeout_s: 1.0
    retry_interval_s: 2.0
    qos_depth: 10

i2c_sensors_node:
  ros__parameters:
    bus: 1
    mux_address: 0x70
    mux_channel_count: 4
    qos_depth: 10
    retry_interval_s: 2.0
    compass:
      enabled: true
      channel: 0
      address: 0x0E
      frame_id: compass
      # Measurement/read cycles per second, independent of ROS publication.
      read_rate_hz: 10.0
      # Publication does not trigger another measurement or conversion delay.
      publish_rate_hz: 10.0
      max_sample_age_s: 0.5
      reset_value: 0x01
      measurement_value: 0x01
      reset_delay_s: 0.1
      # Wait after the measurement command before reading registers (current driver).
      # This is not a polling period or a freshness check. Confirm the chip's timing
      # or implement its data-ready protocol before reducing/removing this wait.
      conversion_delay_s: 0.02

battery_node:
  ros__parameters:
    gpio_chip: 0
    link_gpio_line: 6
    gpio_line: 13
    active_level: 1
    pull: down
    # Poll the low-alarm GPIO; must be positive (no on-data mode).
    # ESP32 voltage reception remains callback-driven in the driver.
    read_rate_hz: 10.0
    # Independent periodic publication; must be positive.
    publish_rate_hz: 10.0
    # Maximum age of the cached low-alarm reading.
    max_sample_age_s: 0.5
    # Maximum age of the voltage value reported by the driver.
    voltage_max_age_s: 5.0
    qos_depth: 10
    shutdown_enabled: true
    low_samples_required: 1
    # Preserves the existing shutdown request; host behaviour depends on Docker.
    shutdown_command: [sudo, shutdown, "-h", now]
