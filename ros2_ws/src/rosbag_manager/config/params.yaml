rosbag_manager_node:
  ros__parameters:
    bag_prefix: "rosbag2_"
    sigint_timeout: 5.0
    # How often to check whether the recorder process is still running.
    process_check_rate_hz: 2.0
    # Periodic state publication, independent of process checks.
    # Start/stop results and detected unexpected exits also publish immediately.
    publish_rate_hz: 2.0
    # Omit record_dir to use ~/ros2_ws/rosbags/raw_recordings.
