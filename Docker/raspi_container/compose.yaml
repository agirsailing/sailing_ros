name: agir-raspi

services:
  jazzy:
    build: ./
    image: agirsailing:jazzy-raspi
    container_name: agir-ros-raspi
    user: "ros"
    working_dir: /home/ros/ros2_ws
    environment:
      - QT_QPA_PLATFORM=wayland
      - WAYLAND_DISPLAY=wayland-0
      - XDG_RUNTIME_DIR=/tmp/runtime-ros
    volumes:
      - ../../ros2_ws:/home/ros/ros2_ws
      # Match the host desktop user; the target follows XDG_RUNTIME_DIR.
      - /run/user/1000/wayland-0:/tmp/runtime-ros/wayland-0
      # GPU acceleration and X11 access.
      - /dev/dri:/dev/dri
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ${HOME}/.Xauthority:/home/ros/.Xauthority:ro
      # Linux hardware access: USB serial, I2C and GPIO.
      - /dev:/dev
    devices:
      - /dev/ttyAMA0:/dev/ttyAMA0
    group_add:
      - "dialout"
      - "tty"
      # Optional host device groups; uncomment after setting the actual IDs.
      # I2C_GID: stat -c '%g' /dev/i2c-1
      # GPIO_GID: stat -c '%g' /dev/gpiochip0
      # - "${I2C_GID}"
      # - "${GPIO_GID}"
    network_mode: host
    ipc: host
    privileged: true
    stdin_open: true
    tty: true
