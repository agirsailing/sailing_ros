name: agir-raspi

services:
  jazzy:
    build: ./
    image: agirsailing:jazzy-raspi
    container_name: agir-ros-raspi
    user: "ros"
    working_dir: /home/ros/ros2_ws
    # Headless by default: sensors, MQTT and recording need no desktop session.
    volumes:
      - ../../ros2_ws:/home/ros/ros2_ws
      # Linux hardware access: USB serial, I2C and GPIO.
      - /dev:/dev
    # /dev above also exposes the BNO085 GPIO UART (/dev/ttyAMA0).
    # Configure it with the hardware setup step and reboot before live acquisition.
    group_add:
      - "dialout"
      - "tty"
      # Optional host device groups; uncomment after setting the actual IDs.
      # I2C_GID: stat -c '%g' /dev/i2c-1
      # GPIO_GID: stat -c '%g' /dev/gpiochip0
      # - "${I2C_GID}"
      # - "${GPIO_GID}"
    network_mode: host
    ipc: host
    privileged: true
    stdin_open: true
    tty: true
