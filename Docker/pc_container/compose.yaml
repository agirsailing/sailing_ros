name: agir-ros-pc

services:
  jazzy:
    build: ./
    image: agirsailing:jazzy-desktop
    container_name: agir-ros-pc
    user: "ros"
    working_dir: /home/ros/ros2_ws
    volumes:
      - ../../ros2_ws/src:/home/ros/ros2_ws/src
      - ../../ros2_ws/scripts:/home/ros/ros2_ws/scripts
      - ../../ros2_ws/rosbags:/home/ros/ros2_ws/rosbags
      - ../../ros2_ws/tools:/home/ros/ros2_ws/tools
    # The default bridge supports outbound MQTT and ROS nodes in this container.
    # Host networking, hardware access and an X server are not required on the PC.
    stdin_open: true
    tty: true
