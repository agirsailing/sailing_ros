name: agir-pc

services:
  jazzy:
    build: .
    image: agirsailing:jazzy-desktop
    container_name: agir-ros-pc
    user: "ros"
    working_dir: /home/ros/ros2_ws
    environment:
      - DISPLAY=${DISPLAY:-host.docker.internal:0}
      - QT_X11_NO_MITSHM=1
    volumes:
      - ../../ros2_ws/src:/home/ros/ros2_ws/src
      - ../../ros2_ws/scripts:/home/ros/ros2_ws/scripts
      - ../../ros2_ws/rosbags:/home/ros/ros2_ws/rosbags
      - ../../ros2_ws/tools:/home/ros/ros2_ws/tools
      - ../../ros2_ws/CSVs:/home/ros/ros2_ws/CSVs
      # Optional Linux X11/GPU mounts; enable only if these host paths exist.
      # - /dev/dri:/dev/dri
      # - /tmp/.X11-unix:/tmp/.X11-unix
      # - ${HOME}/.Xauthority:/home/ros/.Xauthority:ro
    # On Docker Desktop, enable host networking in Settings > Resources > Network.
    network_mode: host
    ipc: host
    stdin_open: true
    tty: true
    command: bash
